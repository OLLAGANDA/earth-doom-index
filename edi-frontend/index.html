<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- 페이지별 <title>, <meta description>, <meta robots>, canonical, hreflang은
         vite-react-ssg의 <Head>(react-helmet)가 prerender HTML에 주입한다.
         여기 두면 head에 중복돼서 GSC가 어떤 걸 선택할지 모호해지므로 제거. -->

    <meta property="og:image" content="https://www.earthdoomindex.com/api/og" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Earth Doom Index — daily threat score" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Earth Doom Index" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://www.earthdoomindex.com/api/og" />

    <script>
      (function () {
        var p = location.pathname;
        if (p !== '/' && p !== '/index.html') return;
        try {
          var saved = localStorage.getItem('edi-lang');
          var lang = (saved === 'ko' || saved === 'en')
            ? saved
            : ((navigator.language || '').toLowerCase().indexOf('ko') === 0 ? 'ko' : 'en');
          location.replace('/' + lang + location.search + location.hash);
        } catch (e) {
          location.replace('/en');
        }
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/galmuri/dist/galmuri.css" rel="stylesheet" />

    <script async src="https://www.googletagmanager.com/gtag/js?id=G-JXBQ7GGV9B"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-JXBQ7GGV9B');
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
